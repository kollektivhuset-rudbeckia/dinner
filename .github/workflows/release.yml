name: Build and publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      # Never publish an image whose tests do not pass.
      - name: Test
        run: go test -count=1 ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest=false switches off the action's implicit handling, so every
          # tag this image gets is spelled out under `tags` rather than
          # inferred. Note that both inputs are literal block scalars: a "#"
          # line inside them is data, not a comment, so keep remarks out here.
          flavor: |
            latest=false
          # Rules, in order:
          #   :latest        on main, and on a stable release tag (pre-releases
          #                  carry a hyphen and must not move it)
          #   :main          the branch name
          #   :1.2.3, :1.2   from a v1.2.3 tag
          #   :sha-abc1234   every build, so a deploy can pin an exact commit
          #
          # The first rule matches the ref rather than using the action's
          # {{is_default_branch}}. That helper asks GitHub what the default
          # branch is, and the answer can disagree with the branch being built:
          # the very first push here went to main while the repository still
          # said master, so no :latest was derived and the build went green
          # anyway. This workflow only ever runs for main and for v* tags, so
          # naming the branch is both simpler and impossible to get wrong.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Guards the rules above: :latest is easy to lose to a small edit here,
      # and the whole deploy story depends on it.
      #
      # The refs listed here are exactly the ones the workflow triggers on, so
      # anything that reaches this step and is not a pre-release tag must carry
      # a :latest. An unrecognised ref is a mismatch between the trigger and
      # this check, and is treated as a failure rather than waved through —
      # that silence is what hid the missing :latest the first time round.
      - name: Check that :latest was derived
        env:
          REF: ${{ github.ref }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "Tags for $REF:"
          echo "$TAGS" | sed 's/^/  /'
          case "$REF" in
            refs/tags/*-*)
              echo "Pre-release tag: :latest is intentionally left alone."
              exit 0
              ;;
            refs/heads/main|refs/tags/v*)
              ;;
            *)
              echo "::error::$REF is built but is not a ref this check knows about."
              echo "Add it to the tag rules and to this check, or drop it from on.push."
              exit 1
              ;;
          esac
          if ! echo "$TAGS" | grep -q ':latest$'; then
            echo "::error::No :latest tag was derived for $REF"
            exit 1
          fi
          echo ":latest will be published."

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}" | sed 's/^/docker pull /'
            echo '```'
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
