services:
  dinners:
    image: ghcr.io/o5ten/dinner:latest
    container_name: dinners-rudbeckia
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # --- Required ---------------------------------------------------------
      DINNER_PASSWORD: ${DINNER_PASSWORD:?set DINNER_PASSWORD in .env}
      BASE_URL: ${BASE_URL:-https://dinner.rudbeckia.nu}

      # --- Optional ---------------------------------------------------------
      # Unlocks /admin: matlag, säsonger, uppehåll and the schedule.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Keeps sessions alive across a password change if you set it yourself.
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_DAYS: ${SESSION_DAYS:-90}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # --- Mattermost -------------------------------------------------------
      # The bot that tells the cooking team's leader that the list is ready.
      # Without these the site still works; the message is only written to the
      # log, and the list is still on the site.
      MATTERMOST_URL: ${MATTERMOST_URL:-}
      MATTERMOST_TOKEN: ${MATTERMOST_TOKEN:-}
    volumes:
      - dinners-data:/data
      # Mount your own house settings over the ones baked into the image.
      - ./config.yaml:/config.yaml:ro
    healthcheck:
      # The image has no shell, so call the binary's own version flag rather
      # than curl, which is not in there either.
      test: ["CMD", "/dinners", "-version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  dinners-data:
